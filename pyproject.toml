[project]
name = "mirrordash-calendar"
version = "1.1.0"
description = "Detailed calendar module showing upcoming events"
requires-python = ">=3.14"
authors = [
    { name = "MirrorDash Developer" }
]
# The mirror provides the rest (rendering, fetch_json/fetch, translations); add only what plugin.py imports
dependencies = [
    "icalendar",
    "recurring-ical-events",
    "babel",
]

[project.entry-points."mirrordash.modules"]
mirrordash_calendar = "mirrordash_calendar.plugin:CalendarModule"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mirrordash_calendar"]
